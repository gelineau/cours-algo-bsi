<!DOCTYPE html>
<html>
<head>
    <title>Add user</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="page-card">
        <h1>Ajouter un utilisateur</h1>
        <form id="user-form" action="{{ url_for('create_user_controller') }}" method="POST" novalidate>
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <p id="form-error" class="error-message"></p>

            <button type="submit">Submit</button>
        </form>
        <p><a href="{{ url_for('index_controller') }}">Retour à l'accueil</a></p>
    </main>
    <script src="{{ url_for('static', filename='user.js') }}"></script>
</body>
</html>
